name: TapeAgent verify
description: Replay agent scenarios from a manifest in CI (no API keys).
inputs:
  manifest:
    description: Path to verify_manifest.yaml
    required: true
  python-version:
    description: Python version
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install tapeagent
      shell: bash
      run: pip install -e ".[dev]"
    - name: Verify cassettes
      shell: bash
      env:
        TAPEAGENT_MODE: replay
      run: tapeagent verify "${{ inputs.manifest }}"
