name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Unit & integration tests (replay)
        env:
          TAPEAGENT_MODE: replay
        run: pytest -q
      - name: tapeagent verify (committed cassettes)
        env:
          TAPEAGENT_MODE: replay
        run: tapeagent verify examples/verify_manifest.yaml
      - name: CLI smoke
        run: |
          tapeagent show src/tapeagent/demo/cassettes/weather_query.yaml weather_query

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install build
          python -m build
